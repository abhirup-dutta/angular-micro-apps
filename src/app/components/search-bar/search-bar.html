<div>
  <h1>Search Users</h1>
  <div>
    Type in to search for users.
  </div>
</div>
<div>
  <form>
    <input type="search" [formControl]="searchControl">
  </form>
</div>
<div>
  @for (user of users(); track user.id) {
    <div>
      {{ user.firstName + " " + user.lastName}}
    </div>
  }
</div>
